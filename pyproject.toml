[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["climate/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["climate"]
omit = ["climate/migrations/*"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
