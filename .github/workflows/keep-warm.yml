name: Keep the demo awake

# Render's free tier stops a web service after 15 minutes without traffic, and the next visitor
# waits about a minute. This asks for a static file every 10 minutes: WhiteNoise answers it
# without touching the database, so Neon's free compute can still sleep.
# Cost: keeps the one free instance up all month (~744 of Render's 750 free hours per workspace).
# To stop it: disable this workflow in the Actions tab.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a static file
        env:
          URL: https://uk-climate-insights.onrender.com/static/climate/css/app.css
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 --output /dev/null --write-out "%{http_code} in %{time_total}s\n" "$URL"
