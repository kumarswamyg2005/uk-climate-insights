name: Monthly Met Office ingest

# The Met Office refreshes the series at the start of each month. This job runs the same
# re-runnable ingest the container uses, straight against the production database, so the web
# service never has to do long work in a request. A run that isn't a full success fails the job,
# and GitHub emails the repository owner.
on:
  schedule:
    - cron: "17 6 2 * *" # 06:17 UTC on the 2nd of every month
  workflow_dispatch: # "Run workflow" button for a manual refresh

permissions:
  contents: read

concurrency:
  group: metoffice-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the database secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Throwaway SECRET_KEY (nothing is signed in this job)
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      - name: Database schema is up to date
        run: python manage.py migrate --check
      - name: Ingest all 119 files
        run: python manage.py ingest_metoffice --strict
