name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: climate
          POSTGRES_PASSWORD: climate
          POSTGRES_DB: climate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U climate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://climate:climate@localhost:5432/climate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Static files build with production (manifest) storage
        run: python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-not-secret
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript unit tests
        run: node --test tests/js/*.test.mjs

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: climate
          POSTGRES_PASSWORD: climate
          POSTGRES_DB: climate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U climate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://climate:climate@localhost:5432/climate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser tests
        run: pytest -m e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build --tag uk-climate-insights:ci .
